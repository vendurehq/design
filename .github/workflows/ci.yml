name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check-types

      - name: Check generated CSS freshness
        run: bun run check-freshness

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Package smoke test
        run: bun run pack:check

      - name: Build Storybook
        run: cd apps/storybook && bun run build

      - name: Install Playwright browsers
        run: cd apps/storybook && bunx playwright install --with-deps chromium

      - name: Serve Storybook static build
        run: |
          cd apps/storybook
          bunx http-server storybook-static --port 6006 --silent &
          echo $! > "$RUNNER_TEMP/storybook-server.pid"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:6006 > /dev/null && break
            sleep 1
          done

      # Blocking: every story is scanned in light and dark mode, and a serious or
      # critical axe violation fails the build. See docs/testing.md.
      - name: Storybook a11y smoke test
        run: cd apps/storybook && bun run test-storybook -- --url http://127.0.0.1:6006 --ci

      - name: Stop Storybook static server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/storybook-server.pid")" || true

      # Capture-only: screenshot every story and publish the set as an artifact
      # for manual review. Not a gate — no committed baselines, no pixel diff.
      - name: Capture visual snapshots
        run: cd apps/storybook && bunx playwright test
        continue-on-error: true

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: |
            apps/storybook/visual-output
            apps/storybook/test-results
          if-no-files-found: ignore
          retention-days: 14
