name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check-types

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Build Storybook
        run: cd apps/storybook && bun run build

      - name: Install Playwright browsers
        run: cd apps/storybook && bunx playwright install --with-deps chromium

      - name: Serve Storybook static build
        run: |
          cd apps/storybook
          bunx http-server storybook-static --port 6006 --silent &
          echo $! > "$RUNNER_TEMP/storybook-server.pid"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:6006 > /dev/null && break
            sleep 1
          done

      # Advisory for now: the existing story suite carries pre-existing serious/
      # critical axe violations (unlabeled controls in isolated stories, icon-only
      # buttons, etc.). The gate runs and logs them but does not block, so it can
      # be adopted incrementally. Remove continue-on-error to make it enforcing
      # once the pre-existing debt is triaged. See docs/testing.md.
      - name: Storybook a11y smoke test
        run: cd apps/storybook && bun run test-storybook -- --url http://127.0.0.1:6006 --ci
        continue-on-error: true

      - name: Stop Storybook static server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/storybook-server.pid")" || true

      - name: Check for visual regression baselines
        id: visual-baselines
        run: |
          cd apps/storybook
          if [ -d visual/__screenshots__/linux ] && [ -n "$(ls -A visual/__screenshots__/linux 2>/dev/null)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Visual regression tests
        run: cd apps/storybook && bunx playwright test
        continue-on-error: ${{ steps.visual-baselines.outputs.exists != 'true' }}

      - name: Upload visual regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-output
          path: |
            apps/storybook/visual/__screenshots__
            apps/storybook/test-results
          if-no-files-found: ignore
          retention-days: 14
