name: Release ui

on:
  push:
    tags:
      - "ui/v*"

concurrency:
  group: release-ui
  cancel-in-progress: false

jobs:
  release:
    name: Publish @vendure-io/ui
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

      - name: Get bot user ID
        id: get-user
        run: echo "user-id=$(gh api "/users/${{ steps.bot-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.bot-token.outputs.token }}

      - name: Extract release metadata
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#ui/v}"
          NPM_TAG="latest"
          VERSION_WITHOUT_BUILD="${VERSION%%+*}"

          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            PRERELEASE="${VERSION_WITHOUT_BUILD#*-}"
            NPM_TAG="${PRERELEASE%%.*}"

            if [[ ! "$NPM_TAG" =~ ^[a-z][a-z0-9-]*$ ]]; then
              echo "Prerelease versions must start with a named npm dist-tag, e.g. alpha, beta, rc, or next." >&2
              exit 1
            fi
          else
            # Stable release: keep `latest` on the newest major; route older majors to v<major>.
            RELEASE_MAJOR="${VERSION_WITHOUT_BUILD%%.*}"
            CURRENT_LATEST="$(npm view @vendure-io/ui@latest version 2>/dev/null || echo "0.0.0")"
            CURRENT_MAJOR="${CURRENT_LATEST%%.*}"
            if [[ "$RELEASE_MAJOR" =~ ^[0-9]+$ && "$CURRENT_MAJOR" =~ ^[0-9]+$ && "$RELEASE_MAJOR" -lt "$CURRENT_MAJOR" ]]; then
              NPM_TAG="v${RELEASE_MAJOR}"
            fi
          fi

          {
            echo "VERSION=$VERSION"
            echo "NPM_TAG=$NPM_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Determine release branch
        id: relbranch
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          TARGET="$(gh release view "$GITHUB_REF_NAME" --json targetCommitish --jq .targetCommitish 2>/dev/null || echo "")"
          if [[ -n "$TARGET" ]] && git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then
            echo "branch=$TARGET" >> "$GITHUB_OUTPUT"
          else
            echo "branch=" >> "$GITHUB_OUTPUT"
            echo "::warning::Release target '$TARGET' is not a branch; skipping version bump-back."
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Check generated CSS freshness
        run: bun run check-freshness

      - name: Update package version
        run: |
          jq --arg v "${{ steps.version.outputs.VERSION }}" '.version = $v' \
            packages/ui/package.json > tmp.json && mv tmp.json packages/ui/package.json

      - name: Build
        run: bun run build

      # bun pm pack resolves the workspace:^ peer range from bun.lock, and the
      # design-tokens version bump-back does not update bun.lock.
      - name: Sync workspace versions into bun.lock
        run: bun install

      - name: Pack
        id: pack
        run: |
          TARBALL="$(bun pm pack --destination "$RUNNER_TEMP" --quiet)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
        working-directory: packages/ui

      # Trusted publishing: npm authenticates with the GitHub OIDC token (id-token: write).
      - name: Publish
        run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public --tag "${{ steps.version.outputs.NPM_TAG }}"

      - name: Commit version bump
        if: steps.relbranch.outputs.branch != ''
        run: |
          BRANCH="${{ steps.relbranch.outputs.branch }}"
          git config user.name "${{ steps.bot-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.get-user.outputs.user-id }}+${{ steps.bot-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git checkout -- .
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          jq --arg v "${{ steps.version.outputs.VERSION }}" '.version = $v' \
            packages/ui/package.json > tmp.json && mv tmp.json packages/ui/package.json
          git add packages/ui/package.json
          git commit -m "chore(ui): bump version to ${{ steps.version.outputs.VERSION }}"
          git push origin "HEAD:$BRANCH"
